<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Offline | Mwezora</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left)); background: #faf7f2; color: #27272a; }
      main { width: min(100%, 28rem); text-align: center; }
      img { width: min(15rem, 70vw); height: auto; }
      h1 { margin: 2rem 0 .5rem; font-size: 1.5rem; }
      p { margin: 0; color: #71717a; line-height: 1.6; }
      button { margin-top: 1.5rem; min-height: 2.75rem; border: 0; border-radius: 999px; padding: 0 1.25rem; background: #a66f3f; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) { body { background: #18181b; color: #fafafa; } p { color: #a1a1aa; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/mwezora-horizontal-classic.svg" alt="Mwezora" />
      <h1>You’re offline</h1>
      <p>Reconnect to continue shopping, manage your account, or complete a transaction. No purchase has been submitted.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
